version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: gtmotive-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: GtMotiveEstimate
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - gtmotive-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  gtmotive-api:
    image: gtmotive-estimate-api:latest
    build:
      context: ..
      dockerfile: src/GtMotive.Estimate.Microservice.Host/Dockerfile
      args:
        - PersonalAccessToken=${PERSONAL_ACCESS_TOKEN:-}
    container_name: gtmotive-estimate-api
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      MongoDb__ConnectionString: "mongodb://root:rootpassword@mongodb:27017/GtMotiveEstimate?authSource=admin"
      MongoDb__MongoDbDatabaseName: "GtMotiveEstimate"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gtmotive-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongodb_data:
  mongodb_config:

networks:
  gtmotive-network:
    driver: bridge